# Grimoire book configuration for the bioinformatics deck.
# Builds docs/ into a static documentation site, published to GitHub Pages by
# .github/workflows/docs.yml on every push to main.

[book]
title = "@deckyard/bioinformatics"
description = "Sequence manipulation for DNA, RNA and protein, in Jennifer."
language = "en"
src = "docs"

[build]
out = "site"
clean = true

[html]
theme = "nordic"
mode = "auto"
tocDepth = 3
sectionNumbers = true
logo = "deckyard.svg"
favicon = "deckyard.svg"
repoUrl = "https://github.com/deckyard/deck-bioinformatics"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-bioinformatics/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[highlightjs]
enabled = false

[search]
enabled = true

[pdf]
enabled = false
