# Grimoire book configuration for the bioinformatics deck.
# Builds docs/ into a static documentation site, published to GitHub Pages by
# .github/workflows/docs.yml on every push to main.

[book]
title = "@jennifer/bioinformatics"
description = "Sequence manipulation for DNA, RNA and protein, in Jennifer."
language = "en"
src = "docs"

[build]
out = "site"
clean = true

[html]
theme = "nordic"
mode = "auto"
tocDepth = 3
sectionNumbers = true
repoUrl = "https://github.com/jennifer-language/deck-bioinformatics"
repoLabel = "Source"
editUrl = "https://github.com/jennifer-language/deck-bioinformatics/edit/main/docs/{path}"

[highlight]
enabled = true

[highlightjs]
enabled = false

[search]
enabled = true

[pdf]
enabled = false
